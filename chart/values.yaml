# Default values for myapp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
stage: prd
env: {}
# configuration for grapple ApplicationSet (gras)
gras-deploy:
  enabled: false
grases:
  gras:
    enabled: true
    gras: {}
    grapi:
      name: bexio-demo
      runimages:
        image: grpl/loopback
        tag: "0.4.24"
      discoveredrepos: false
      buildimages:
        enabled: true
        tag: 0.0.1
      deployimages:
        enabled: true
      ingress: true
      ssl: true
      sslissuer: letsencrypt-grapple-demo
      autoscaling:
        maxReplicas: 3
      extraSecrets:
        - bexio-config
        - bexio-external
      initContainers:
        - name: init-modules
          spec:
            name: init-modules
            image: grpl/grpl-bexio-demo-modules:devspace
            imagePullPolicy: Always
            command: ["/bin/sh", "-c", "cp -r /modules/gras/. /opt/custom-modules/ && chown -R 1000:1000 /opt/custom-modules"]
            volumeMounts:
              - name: custom-modules
                mountPath: /opt/custom-modules
      volumeMounts:
        - name: custom-modules
          mountPath: /opt/custom-modules
      volumes:
        - name: custom-modules
          emptyDir: {}
      datasources:
        - name: external
          content: '{"name":"external","connector":"rest","disableMigration":true,"baseURL":"https://api.bexio.com/2.0","options":{"headers":{"accept":"application/json","content-type":"application/json","Authorization":"Bearer ${BEXIO_TOKEN}"}},"operations":[]}'
      models: []
      repositories: []
      openapis: []
      cacheconfigs: []
      controllers: []
      postpatches: []
      services: []
      serviceproviders: []
      prerelationpatches: []
      prepatches: []
      prediscoverypatches: []
    gruim:
      name: bexio-demo
      runimages:
        tag: 0.3.62
        image: grpl/gruim
      buildimages:
        enabled: true
        tag: 0.0.1
      deployimages:
        enabled: true
      ssl: true
      sslissuer: letsencrypt-grapple-demo
      autoscaling:
        maxReplicas: 3
      style: '{"colors":{"primary":{"DEFAULT":"#34344A","fg":"#fff"},"accent":{"DEFAULT":"#CC5A71","fg":"#fff"}}}'
      config: ""
      additionalpackages: ""
      custommodules: []
      prepatches: []
      postpatches: []
replicaCount: 1
image:
  repository: grpl/grpl-bexio-demo
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "devspace"
imagetest:
  repository: grpl/grpl-bexio-demo-test
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 80
lookup:
  enabled: true
  productName: "bexio-demo"
  domain: MYDOMAIN.grpl.io
  sslissuer: MYISSUER
ingress:
  enabled: true
  ssl: true
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  # hosts:
  #   - host: chart-example.local
  #     paths:
  #       - path: /
  #         pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
resources: {}
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity: {}
