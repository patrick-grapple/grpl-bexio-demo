services:
  grapi:
    image: grpl/loopback:0.4.24
    ports:
      - "3333:3000"
    command: >-
      /bin/sh -c "sh /grapi/prepatches/create-bexio-external-options.sh && ./start.sh"
    environment:
      DEV: "true"
      CustomControllerDir: injections
      CustomControllerDirs: '{"controllerDirs":"injections"}'
      BEXIO_TOKEN: "${BEXIO_TOKEN:?Set BEXIO_TOKEN in .env}"
      ExternalOperations: ./config/bexio-options.json
      DataSources: >-
        external:{"name":"external","connector":"rest","disableMigration":true,"baseURL":"https://api.bexio.com/2.0","options":{"headers":{"accept":"application/json","content-type":"application/json","Authorization":"Bearer ${BEXIO_TOKEN}"}},"operations":[]}
    volumes:
      - ./grases/gras/grapi:/grapi
      - ./grases/gras/grapi/injections:/home/node/app/src/injections:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/ping"]
      interval: 5s
      timeout: 3s
      retries: 200
      start_period: 60s

  gruim:
    image: grpl/gruim:0.3.62
    ports:
      - "8080:8080"
    environment:
      DEV: "false"
      OPENAPI_URL: http://grapi:3000/openapi.json
      SVELTE_APP_API_ENDPOINT: http://localhost:3333/
      SVELTE_APP_OPENAPI_URL: http://localhost:3333/openapi.json
    depends_on:
      grapi:
        condition: service_healthy
